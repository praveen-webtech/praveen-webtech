<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Praveen - Web Developer, UI/UX Designer, Multimedia Creator" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#1b1740"/>
      <stop offset="1" stop-color="#302b63"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; }
    .glow1 { animation: drift1 9s ease-in-out infinite alternate; }
    .glow2 { animation: drift2 11s ease-in-out infinite alternate; }
    .role  { opacity: 0; animation: role 9s ease-in-out infinite; }
    .r2    { animation-delay: 3s; }
    .r3    { animation-delay: 6s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(40px, 20px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-40px, -15px); } }
    @keyframes role {
      0%   { opacity: 0; transform: translateY(8px); }
      5%   { opacity: 1; transform: translateY(0); }
      30%  { opacity: 1; transform: translateY(0); }
      35%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Soft glowing orbs -->
  <circle class="glow1" cx="200" cy="80" r="110" fill="#7c3aed" opacity="0.45" filter="url(#blur)"/>
  <circle class="glow2" cx="1080" cy="250" r="130" fill="#4f46e5" opacity="0.4" filter="url(#blur)"/>

  <!-- Decorative code symbols -->
  <text x="70" y="190" font-size="120" fill="#a78bfa" opacity="0.12" font-weight="700">&lt;/&gt;</text>
  <text x="1090" y="200" font-size="130" fill="#a78bfa" opacity="0.12" font-weight="700">{ }</text>

  <!-- Greeting -->
  <text x="640" y="95" text-anchor="middle" font-size="20" fill="#a78bfa" letter-spacing="6">HELLO, I'M</text>

  <!-- Name -->
  <text x="640" y="170" text-anchor="middle" font-size="76" font-weight="700" fill="url(#title)" letter-spacing="2">Praveen</text>

  <!-- Accent bar -->
  <rect x="440" y="188" width="400" height="2" fill="url(#bar)"/>

  <!-- Rotating roles -->
  <g font-size="26" font-weight="500" fill="#e6edf3" text-anchor="middle">
    <text class="role r1" x="640" y="232">Web Developer</text>
    <text class="role r2" x="640" y="232">UI/UX Designer</text>
    <text class="role r3" x="640" y="232">Multimedia Creator</text>
  </g>

  <!-- Subtitle -->
  <text x="640" y="278" text-anchor="middle" font-size="16" fill="#9ca3af" letter-spacing="1">Multimedia &amp; Web Technology Undergraduate  ·  Sri Lanka</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
